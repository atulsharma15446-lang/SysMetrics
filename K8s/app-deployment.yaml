apiVersion: apps/v1
kind: Deployment
metadata:
  name: sysmetric
  namespace: sysmetric

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sysmetric

  template:
    metadata:
      labels:
        app: sysmetric

    spec:
      containers:
        - name: sysmetric

          image: your-dockerhub-username/sysmetric:latest

          ports:
            - containerPort: 8000

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sysmetric-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: sysmetric-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: sysmetric-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: sysmetric-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sysmetric-secret
                  key: DB_PASSWORD
